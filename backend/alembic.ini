# Used for developer commands such as:
#   alembic revision --autogenerate -m "describe change"
# The app applies migrations itself at startup (ALLOGATOR_AUTO_MIGRATE) or via `allogator migrate`.
[alembic]
script_location = allogator/migrations
sqlalchemy.url = sqlite:///./allogator.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
